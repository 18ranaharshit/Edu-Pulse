<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="#0f172a"/>

  <!-- Graduation cap - top part -->
  <polygon points="32,12 10,24 32,33 54,24" fill="url(#grad)" opacity="0.9"/>

  <!-- Graduation cap - tassel line -->
  <line x1="46" y1="22" x2="46" y2="34" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="46" cy="35" r="2.2" fill="#a78bfa"/>

  <!-- Cap brim sides -->
  <path d="M18,26 L18,35 Q25,40 32,38 Q39,40 46,35 L46,26" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Pulse/heartbeat wave -->
  <polyline
    points="8,42 16,42 20,42 23,36 26,48 29,32 32,50 35,38 38,44 42,42 48,42 52,42 56,42"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Data nodes -->
  <circle cx="23" cy="36" r="1.8" fill="#38bdf8" opacity="0.8"/>
  <circle cx="29" cy="32" r="1.8" fill="#6366f1" opacity="0.8"/>
  <circle cx="32" cy="50" r="1.8" fill="#a78bfa" opacity="0.8"/>
  <circle cx="35" cy="38" r="1.8" fill="#6366f1" opacity="0.8"/>
</svg>
